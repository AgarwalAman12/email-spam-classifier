<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 300px;
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f5f0;
      color: #18181b;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    h1 { margin: 0; font-size: 15px; }
    label { font-size: 13px; display: flex; align-items: center; gap: 6px; cursor: pointer; }
    textarea {
      width: 100%;
      box-sizing: border-box;
      height: 84px;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #d4d4d8;
      font-size: 12px;
      resize: none;
      margin-bottom: 8px;
    }
    button {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 6px;
      background: #18181b;
      color: #fff;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    #out {
      margin-top: 10px;
      font-size: 12px;
      font-weight: 600;
      padding: 8px;
      border-radius: 6px;
      display: none;
    }
    .spam { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    .ham { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
    .err { background: #fffbeb; color: #b45309; border: 1px solid #fde68a; }
  </style>
</head>
<body>
  <div class="row">
    <h1>MailGuard</h1>
    <label>
      <input type="checkbox" id="autoScanToggle" checked>
      Auto-scan inbox
    </label>
  </div>
  <textarea id="quickInput" placeholder="Quick-check any email text..."></textarea>
  <button id="scanBtn">Check Text</button>
  <div id="out"></div>
  <script src="popup.js"></script>
</body>
</html>
